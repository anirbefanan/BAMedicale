<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>BAMI — BA Medicale Intelligence</title>
<style>
:root{font-family:"Plus Jakarta Sans",Arial,sans-serif;color:#30282a;background:#fffaf6;font-size:14px}*{box-sizing:border-box}body{margin:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a9233d;outline-offset:2px}.app{display:flex;flex-direction:column;height:100dvh;min-height:320px}.head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fffdfb;border-bottom:1px solid #ead7d5}.mark{display:grid;place-items:center;width:37px;height:37px;border-radius:11px;background:#a3233a;color:white;font-weight:800}.head-copy{flex:1;min-width:0}.head strong,.head small{display:block}.head small{color:#6f6262;font-size:11px}.icon{width:44px;height:44px;border:1px solid #e8cdcb;border-radius:10px;background:#fffaf8;color:#70202e;font-size:20px}.main{flex:1;min-height:0;overflow:auto;padding:17px}.intro{margin:0 0 17px;color:#5d4d50;line-height:1.5}.eyebrow{margin:0 0 6px;color:#a3233a;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em}.main h1{font-size:22px;line-height:1.2;margin:0 0 10px}.field{display:block;margin:0 0 13px}.field span{display:block;margin-bottom:5px;font-weight:700}.field input,.field select,.composer textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid #cdbab7;border-radius:9px;background:#fff;color:#30282a}.field input,.field select{font-size:16px}.field small{display:block;margin-top:4px;color:#736267}.consent{display:flex;gap:10px;align-items:flex-start;margin:15px 0;line-height:1.45}.consent input{width:18px;height:18px;margin-top:2px;accent-color:#a3233a}.privacy{color:#8e1d33;text-decoration:underline}.primary{min-height:44px;padding:10px 17px;border:0;border-radius:10px;background:#a3233a;color:#fff;font-weight:700}.primary:disabled{opacity:.55;cursor:not-allowed}.secondary{min-height:44px;padding:9px 12px;border:1px solid #d9c0bd;border-radius:10px;background:#fff;color:#852438;font-weight:700}.error{margin:8px 0;color:#a9233d;font-weight:700}.conversation{display:flex;flex-direction:column;gap:14px}.bubble{max-width:95%;padding:11px 13px;border-radius:12px;background:#fff;border:1px solid #e9d9d6;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:#f4e6e5}.sources{margin:9px 0 0;padding-left:17px}.sources li{margin:5px 0}.sources a{color:#8e1d33;font-weight:700}.feedback{display:flex;gap:7px;margin-top:9px}.feedback button{min-height:44px;padding:7px 10px;font-size:12px}.chat-foot{padding:12px;border-top:1px solid #ead7d5;background:#fffdfb}.composer{display:flex;gap:8px;align-items:flex-end}.composer textarea{resize:vertical;min-height:46px;max-height:110px;font-size:16px}.composer .primary{flex:none}.note{margin:7px 0 0;color:#716064;font-size:11px}.new-chat{margin:0 0 14px}.empty{color:#65585a;line-height:1.5}.status{min-height:18px;color:#7d2035;font-size:12px}
@media(max-width:390px){.head{padding:10px 12px}.main{padding:14px}.chat-foot{padding:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
<div class="app"><header class="head"><span class="mark" aria-hidden="true">B</span><div class="head-copy"><strong>BAMI</strong><small>BA Medicale Intelligence</small></div><button class="icon" id="close" type="button" aria-label="Minimize BAMI">×</button></header><main class="main" id="main" aria-live="polite"></main><div class="chat-foot" id="chat-foot" hidden><form class="composer" id="ask-form"><label class="sr-only" for="question">Ask BAMI a question</label><textarea id="question" maxlength="1000" rows="1" placeholder="Ask about BA Medicale knowledge" required></textarea><button class="primary" type="submit">Send</button></form><p class="note">Educational information only. Please avoid personal health details.</p><p class="status" id="chat-status" role="status"></p></div></div>
<script>
(() => {
  "use strict";
  const parentOrigin="https://bamedicale.com", bridge=<?!= JSON.stringify(bridge) ?>, state={token:"",sessionId:"",history:[],busy:false};
  const $=id=>document.getElementById(id), main=$("main"), foot=$("chat-foot");
  const send=(type,payload={})=>window.top.postMessage({bami:type,bridge,...payload},parentOrigin);
  const api=(action,input)=>new Promise((resolve,reject)=>{if(!window.google?.script?.run){reject(new Error("BAMI is temporarily unavailable. Please try again shortly."));return;}google.script.run.withSuccessHandler(value=>value?.error?reject(new Error(value.error)):resolve(value)).withFailureHandler(()=>reject(new Error("BAMI is temporarily unavailable. Please try again shortly."))).bamiApi(action,input);});
  const element=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;};
  const error=(text)=>{let node=$("form-error");if(!node){node=element("p","error");node.id="form-error";main.append(node);}node.textContent=text;};
  function onboard(){foot.hidden=true;main.replaceChildren();main.append(element("p","eyebrow","Your guide to BA Medicale knowledge."),element("h1","","Ask BAMI"),element("p","intro","Find published BA Medicale learning materials and ask concise questions about them."));
    const form=element("form");form.id="onboard-form";form.innerHTML='<label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required maxlength="254"></label><label class="field"><span>WhatsApp / mobile</span><input name="phone" type="tel" autocomplete="tel" required placeholder="08… or +628…"><small>Indonesian number; stored as +62…</small></label><label class="field"><span>I am a…</span><select name="audience" required><option value="">Select audience</option><option>Doctors</option><option>Healthcare Professionals</option><option>Public</option></select></label><label class="field"><span>Profession</span><select name="profession" required disabled><option value="">Select profession</option></select></label><label class="field" id="detail-field" hidden><span>Specialty or other profession (optional)</span><input name="professionDetail" maxlength="80"></label><label class="consent"><input name="consent" type="checkbox" required><span>I agree to BA Medicale using my contact profile to provide and improve BAMI. Chats may be recorded for quality, safety, analytics, and content improvement. I will avoid sensitive personal health information. BAMI is educational and does not replace professional care. <a class="privacy" href="https://bamedicale.com/privacy-policy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.</span></label><button class="primary" type="submit">Start Chat</button>';
    const professions={Doctors:["General Practitioner","Specialist","Resident","Medical Student","Other"],"Healthcare Professionals":["Nurse","Midwife","Pharmacist","Nutritionist / Dietitian","Medical Laboratory Professional","Radiographer","Physiotherapist","Other"],Public:["Private Employee","Government Employee","Student","Entrepreneur","Homemaker","Retired","Other"]};
    const audience=form.elements.audience,profession=form.elements.profession,detail=form.querySelector("#detail-field");audience.addEventListener("change",()=>{profession.replaceChildren(new Option("Select profession",""),...(professions[audience.value]||[]).map(value=>new Option(value,value)));profession.disabled=!audience.value;detail.hidden=true;});profession.addEventListener("change",()=>{detail.hidden=!["Other","Specialist"].includes(profession.value);});
    const start=form.querySelector("button[type=submit]");start.disabled=true;
    const updateStart=()=>{const mobile=form.elements.phone.value.replace(/[\s().-]/g,"");start.disabled=!(form.elements.email.validity.valid&&/^(?:\+?62|0)8[1-9]\d{7,11}$/.test(mobile)&&audience.value&&profession.value&&form.elements.consent.checked);};
    form.addEventListener("input",updateStart);form.addEventListener("change",updateStart);
    form.addEventListener("submit",async event=>{event.preventDefault();start.disabled=true;try{const result=await api("onboard",{email:form.elements.email.value,phone:form.elements.phone.value,audience:audience.value,profession:profession.value,professionDetail:form.elements.professionDetail.value,consent:form.elements.consent.checked,consentVersion:"bami-v1-2026-10"});state.token=result.token;state.sessionId=result.sessionId;state.history=[];send("state",{token:state.token});chat();}catch(ex){error(ex.message);}finally{updateStart();}});
    main.append(form);form.elements.email.focus();
  }
  function message(question,answer,sources,id,feedback){if(question)main.append(element("div","bubble user",question));const bubble=element("div","bubble",answer);if(Array.isArray(sources)&&sources.length){const list=element("ul","sources");sources.forEach(source=>{if(!/^https:\/\/bamedicale\.com\//.test(source.url||""))return;const item=element("li"),link=element("a","",`${source.type||"Content"}: ${source.title||"Open source"}`);link.href=source.url;link.target="_blank";link.rel="noopener noreferrer";link.addEventListener("click",()=>send("content-click"));item.append(link);list.append(item);});bubble.append(list);}if(id&&!feedback){const controls=element("div","feedback");[["Helpful","HELPFUL"],["Not Helpful","NOT_HELPFUL"]].forEach(([label,value])=>{const button=element("button","secondary",label);button.type="button";button.addEventListener("click",async()=>{try{const result=await api("feedback",{token:state.token,inquiryId:id,value});if(result.saved){controls.replaceChildren(element("span","","Thank you for the feedback."));send("feedback");}}catch(_){controls.replaceChildren(element("span","","Feedback is temporarily unavailable."));}});controls.append(button);});bubble.append(controls);}main.append(bubble);main.scrollTop=main.scrollHeight;}
  function chat(){foot.hidden=false;main.replaceChildren();const top=element("div","new-chat"),button=element("button","secondary","New Chat");button.type="button";button.addEventListener("click",async()=>{try{const result=await api("newChat",{token:state.token});state.sessionId=result.sessionId;state.history=[];chat();}catch(ex){$("chat-status").textContent=ex.message;}});top.append(button);main.append(top);if(!state.history.length)main.append(element("p","empty","Ask about BA Medicale articles, videos, eBooks, seminars, people, or disease topics."));else state.history.forEach(row=>message(row.question,row.answer,row.sources,row.id,true));$("question").focus();}
  $("ask-form").addEventListener("submit",async event=>{event.preventDefault();if(state.busy)return;const input=$("question"),question=input.value.trim(),button=event.currentTarget.querySelector("button");if(question.length<3||question.length>1000)return;state.busy=true;button.disabled=true;$("chat-status").textContent="BAMI is thinking…";try{const result=await api("ask",{token:state.token,sessionId:state.sessionId,question});if(main.querySelector(".empty"))main.querySelector(".empty").remove();message(question,result.answer,result.sources,result.id);input.value="";$("chat-status").textContent=result.status==="ERROR"?"Please retry shortly.":"";send("answer",{status:result.status});}catch(ex){$("chat-status").textContent=ex.message;}finally{state.busy=false;button.disabled=false;}});
  $("close").addEventListener("click",()=>send("close"));document.addEventListener("keydown",event=>{if(event.key==="Escape")send("close");});
  window.addEventListener("message",async event=>{if(event.origin!==parentOrigin||event.data?.bami!=="restore")return;state.token=String(event.data.token||"");if(!state.token){onboard();return;}try{const profile=await api("resume",{token:state.token});state.sessionId=profile.sessionId;state.history=profile.history||[];chat();}catch(_){state.token="";send("state",{token:""});onboard();}});
  send("ready");
})();
</script></body></html>
