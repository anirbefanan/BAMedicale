<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="Doctor-facing scientific publications are available through the BA Medicale Library.">
  <title>Doctor Publications | BA Medicale</title>
  <link rel="canonical" href="https://bamedicale.com/library.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Source+Serif+4:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=immersive-20260902">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <script>
    (() => {
      const source = new URLSearchParams(window.location.search);
      const target = new URLSearchParams({ audience: "doctor" });
      ["category", "disease", "condition", "topic", "type", "author"].forEach((key) => {
        const value = source.get(key);
        if (value) target.set(key, value);
      });
      window.location.replace(`library.html?${target}`);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Doctor publications have moved to the Medical Library.</h1>
    <p><a href="library.html?audience=doctor">Continue to doctor-facing publications</a></p>
  </main>
</body>
</html>
